# Copy to .github/workflows/ci.yml after granting GitHub workflow permission.
name: validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,reports,analysis]'
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
