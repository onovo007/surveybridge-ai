# Copy to .github/workflows/ci.yml after granting GitHub workflow permission.
name: validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,reports,analysis]'
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q
      - run: python scripts/review_scientific_release.py --output release-audit.json
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*
            release-audit.json
